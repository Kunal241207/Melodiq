<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Melodiq — Music Explorer</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap"/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitcount+Grid+Double:wght@100..900&display=swap"/>
    <link rel="stylesheet" href="styles.css"/>
  </head>

  <body>
    <aside>
      <div class="logo">melodi<span>q</span></div>

      <div class="nav-section">
        <div class="nav-label">Discover</div>

        <button class="nav-item active" id="nav-all" onclick="setView('all')">
          <i class="fa-regular fa-circle-check"></i> All Tracks
        </button>

        <button class="nav-item" id="nav-fav" onclick="setView('liked')">
          <i class="fa-regular fa-heart"></i> Liked Songs
          <span id="fav-count">0</span>
        </button>
      </div>

      <div class="nav-section" style="margin-top: 8px">
        <div class="nav-label">Quick Search</div>

        <button class="nav-item" onclick="quickSearch('taylor swift')">
          <i class="fa-solid fa-magnifying-glass"></i> Taylor Swift
        </button>

        <button class="nav-item" onclick="quickSearch('the weeknd')">
          <i class="fa-solid fa-magnifying-glass"></i> The Weeknd
        </button>

        <button class="nav-item" onclick="quickSearch('drake')">
          <i class="fa-solid fa-magnifying-glass"></i> Drake
        </button>

        <button class="nav-item" onclick="quickSearch('coldplay')">
          <i class="fa-solid fa-magnifying-glass"></i> Coldplay
        </button>

        <button class="nav-item" onclick="quickSearch('arijit singh')">
          <i class="fa-solid fa-magnifying-glass"></i> Arijit Singh
        </button>

        <button class="nav-item" onclick="quickSearch('ar rahman')">
          <i class="fa-solid fa-magnifying-glass"></i> A.R. Rahman
        </button>
      </div>

      <div class="stats-card">
        <h4>Session Stats</h4>

        <div class="stat-row">
          <span class="stat-label">Tracks loaded</span>
          <span class="stat-val" id="stat-loaded">0</span>
        </div>

        <div class="stat-row">
          <span class="stat-label">Avg duration</span>
          <span class="stat-val" id="stat-avg">0:00</span>
        </div>

        <div class="stat-row">
          <span class="stat-label">Total runtime</span>
          <span class="stat-val" id="stat-total">0m</span>
        </div>

        <div class="stat-row">
          <span class="stat-label">Genres found</span>
          <span class="stat-val" id="stat-genres">0</span>
        </div>
      </div>
    </aside>

    <header>
      <div class="search-wrap">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input id="search-input" type="text" placeholder="Search artists, songs, albums…" autocomplete="off" />
      </div>

      <select class="sort-select" id="sort-select" onchange="showSongs()">
        <option value="default">Sort: Default</option>
        <option value="name">Song Name A→Z</option>
        <option value="artist">Artist A→Z</option>
        <option value="duration_asc">Duration ↑</option>
        <option value="duration_desc">Duration ↓</option>
      </select>

      <div class="header-actions">
        <button class="btn-icon" id="view-grid-btn" title="Grid view" onclick="setLayout('grid')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7" />
            <rect x="14" y="3" width="7" height="7" />
            <rect x="3" y="14" width="7" height="7" />
            <rect x="14" y="14" width="7" height="7" />
          </svg>
        </button>

        <button class="btn-icon active" id="view-list-btn" title="List view" onclick="setLayout('list')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="6" x2="21" y2="6" />
            <line x1="3" y1="12" x2="21" y2="12" />
            <line x1="3" y1="18" x2="21" y2="18" />
          </svg>
        </button>
      </div>
    </header>

    <main>
      <div class="genre-chips" id="genre-chips"></div>

      <div class="section-header">
        <span class="section-title" id="section-title">Start Exploring</span>
        <span class="section-count" id="section-count"></span>
      </div>

      <div id="track-container"></div>
    </main>

    <div id="player">
      <div style="display: flex; align-items: center; gap: 12px; flex: 0 0 auto">
        <img id="player-art" class="player-art" src="" alt="" onerror="this.style.display='none'"/>

        <div class="player-info">
          <div id="player-title" class="player-empty">
            Nothing playing — pick a track
          </div>
          <div id="player-artist" class="player-artist"></div>
        </div>
      </div>

      <div class="player-controls">
        <div class="ctrl-btns">
          <button class="ctrl-btn" onclick="playPrev()" title="Previous">
            <i class="fa-solid fa-backward-step"></i>
          </button>

          <button class="ctrl-btn play" id="play-btn" onclick="togglePlay()">
            <i class="fa-solid fa-play" id="play-icon"></i>
          </button>

          <button class="ctrl-btn" onclick="playNext()" title="Next">
            <i class="fa-solid fa-forward-step"></i>
          </button>
        </div>

        <div class="progress-area">
          <span class="time-label" id="time-cur">0:00</span>

          <div class="progress-bar" id="progress-bar" onclick="seekTo(event)">
            <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
          </div>

          <span class="time-label" id="time-total">0:00</span>
        </div>
      </div>

      <div class="player-right">
        <i class="fa-solid fa-volume-low"></i>
        <input type="range" class="volume-slider" id="volume" min="0" max="100" value="80" oninput="setVolume(this.value)" />
      </div>
    </div>

    <div id="toast"></div>

    <script src="script.js"></script>
  </body>
</html>
